<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arthur Bénito — Photographe Professionnel</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <a href="/" class="logo">Arthur <span>Bénito</span></a>
        <nav>
            <a href="#galerie">Galerie</a>
            <a href="#contact">Contact</a>
            <a href="/admin.html">Admin</a>
        </nav>
    </header>

    <section class="hero">
        <h1 id="artist-name">Arthur Bénito</h1>
        <p id="artist-bio">Chargement...</p>
    </section>

    <div class="filters" id="category-filters">
        <button class="filter-btn active" data-category="all">Tout</button>
    </div>

    <main class="gallery" id="galerie"></main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <span class="close-lightbox" id="close-lightbox">&times;</span>
        <img id="lightbox-img" src="" alt="">
        <div class="lightbox-caption">
            <h3 id="lightbox-title"></h3>
            <p id="lightbox-desc"></p>
        </div>
    </div>

    <footer id="contact">
        <p>Contact : <span id="artist-email"></span> | Tél : <span id="artist-phone"></span></p>
        <p style="margin-top: 0.5rem; font-size: 0.85rem;">&copy; 2026 Arthur Bénito. Tous droits réservés.</p>
    </footer>

    <script src="/js/main.js"></script>
</body>
</html>
